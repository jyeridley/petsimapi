<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS99 Toolkit</title>
  <meta name="description" content="Pet Simulator 99 utilities: RAP and exists prices, trade calculator, player lookup, clans, leagues, leaderboards and game update tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Ctext x='32' y='44' font-size='30' font-family='Arial' font-weight='900' text-anchor='middle' fill='white'%3E99%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/prices">
        <span class="brand-mark">99</span>
        <span class="brand-text">PS99 Toolkit</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/prices" data-route="prices">Prices</a>
        <a href="#/trade" data-route="trade">Trade Calc</a>
        <a href="#/players" data-route="players">Players</a>
        <a href="#/clans" data-route="clans">Clans</a>
        <a href="#/leagues" data-route="leagues">Leagues</a>
        <a href="#/boards" data-route="boards">Leaderboards</a>
        <a href="#/updates" data-route="updates">Updates</a>
        <a href="#/data" data-route="data">Game Data</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="container" aria-live="polite"></main>

  <footer class="footer container">
    <p>Unofficial fan tool. Data from the public <a href="https://github.com/BIG-Games-LLC/ps99-public-api-docs" target="_blank" rel="noopener">Pet Simulator 99 API</a> by BIG Games. Responses are cached in your browser to stay well under the 100 requests/minute limit.</p>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
